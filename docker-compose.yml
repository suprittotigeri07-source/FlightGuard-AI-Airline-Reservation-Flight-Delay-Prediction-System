version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flightguard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightguard_pass}
      POSTGRES_DB: ${POSTGRES_DB:-flightguard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flightguard-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flightguard}:${POSTGRES_PASSWORD:-flightguard_pass}@postgres:5432/${POSTGRES_DB:-flightguard_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_min_32_chars}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flightguard-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
